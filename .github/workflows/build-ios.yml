name: Build Dev Reminder iOS (Simulator)

# CI-only verification that the iOS shell compiles on every push. This does
# NOT produce a signed, device-installable IPA — real device / TestFlight
# builds require an Apple Developer account, a distribution certificate and
# a provisioning profile stored as GitHub Secrets (see README for details).

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios-simulator:
    name: Build iOS App (Simulator, unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add iOS platform (if missing)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS project
        env:
          DEV_REMINDER_WEB_URL: ${{ vars.DEV_REMINDER_WEB_URL || 'https://example.com' }}
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build for iOS Simulator (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
