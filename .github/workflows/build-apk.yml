name: Build Dev Reminder APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------
      # Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        working-directory: .
        env:
          CI: false
        run: npm install --legacy-peer-deps
        timeout-minutes: 10


      # -----------------------------
      # Java
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # -----------------------------
      # Gradle
      # -----------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # -----------------------------
      # Build APK
      # -----------------------------
      - name: Debug and Build Android
        run: |
          echo "=== Printing current working directory ==="
          pwd
          echo "=== Listing files in root repository ==="
          ls -la
          echo "=== Listing files inside android folder ==="
          ls -la android || echo "No android folder found"
          echo "=== Attempting Build ==="
          cd android && ./gradlew assembleDebug


      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dev-reminder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk