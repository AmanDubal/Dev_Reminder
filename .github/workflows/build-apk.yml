name: Build Dev Reminder APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-apk:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Android project files
        run: flutter create . --org com.example --project-name dev_reminder --platforms=android --android-language kotlin --no-pub

      - name: Verify native alarm integration
        run: |
          test -f android/app/src/main/kotlin/com/example/dev_reminder/AlarmService.kt
          grep -q 'dev_reminder/alarms' android/app/src/main/kotlin/com/example/dev_reminder/MainActivity.kt
          grep -q 'coreLibraryDesugaringEnabled' android/app/build.gradle

      - name: Add custom alarm sound
        run: mkdir -p android/app/src/main/res/raw && cp assets/alarm.mp3 android/app/src/main/res/raw/alarm.mp3

      - name: Verify pinned Android toolchain
        run: |
          grep -Fq 'id "com.android.application" version "7.4.2"' android/settings.gradle
          grep -Fq 'id "org.jetbrains.kotlin.android" version "1.9.22"' android/settings.gradle
          grep -Fq 'gradle-7.6.4-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'JavaVersion.VERSION_11' android/app/build.gradle
          grep -Fq 'jvmTarget = "11"' android/app/build.gradle
          cd android
          ./gradlew --version

      - name: Clean project build outputs
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/dev_reminder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-reminder-app-release
          path: build/app/outputs/flutter-apk/dev_reminder.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish direct APK download
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/app/outputs/flutter-apk/dev_reminder.apk --title "Dev Reminder ${GITHUB_REF_NAME}" --generate-notes
