<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dev Reminder</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f172a; color: #fff; font-family: -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; }
      .box { padding: 24px; }
      .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.25); border-top-color: #f97316; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <h1 style="font-size:18px;margin:0 0 8px;">Dev Reminder</h1>
      <p style="font-size:13px;color:#94a3b8;margin:0;">Loading your tasks…</p>
    </div>
  </body>
</html>
